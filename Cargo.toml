[package]
name = "handys-vbl"
version = "0.1.3"
edition = "2024"
# 1.88 stabilized let-chains (used throughout); PanicHookInfo::payload_as_str needs 1.91 (clippy::incompatible_msrv checks the rest).
rust-version = "1.99"
license = "MIT"

[workspace]

[dependencies]
handy-sdk = { git = "https://github.com/handy-z/handys-sdk", branch = "main" }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_DirectComposition",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Imaging",
  "Win32_Media",
  "Win32_Networking_WinHttp",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Xps",
  "Win32_System_Com",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Kernel",
  "Win32_System_LibraryLoader",
  "Win32_System_Performance",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
  "Win32_UI_Accessibility",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"

# A panic ends the process, after the crash guard has released held keys.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
debug = "line-tables-only"
split-debuginfo = "packed"
strip = "none"
